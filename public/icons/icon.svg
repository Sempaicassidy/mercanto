<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="cartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#10b981" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="#10b981" stroke-opacity="0.25" stroke-width="4"/>

  <!-- Emerald Halo Center Ring -->
  <circle cx="256" cy="236" r="148" fill="none" stroke="url(#emeraldGrad)" stroke-width="3" stroke-dasharray="8 6" opacity="0.4"/>

  <!-- Glowing Cart Container Circle -->
  <circle cx="256" cy="236" r="132" fill="#18181b" filter="url(#glow)"/>
  <circle cx="256" cy="236" r="132" fill="none" stroke="url(#emeraldGrad)" stroke-width="4"/>

  <!-- Shopping Cart Icon Body -->
  <g transform="translate(148, 140) scale(0.42)">
    <!-- Cart Base / Wheels -->
    <circle cx="160" cy="410" r="36" fill="#10b981"/>
    <circle cx="160" cy="410" r="16" fill="#ffffff"/>
    <circle cx="360" cy="410" r="36" fill="#10b981"/>
    <circle cx="360" cy="410" r="16" fill="#ffffff"/>

    <!-- Cart Basket Outline & Handle -->
    <path d="M40 70 L90 70 L160 330 L390 330 L450 140 L130 140" 
          fill="none" 
          stroke="url(#cartGrad)" 
          stroke-width="32" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    
    <!-- Basket Grid Lines -->
    <path d="M190 170 L210 300" stroke="#10b981" stroke-width="20" stroke-linecap="round"/>
    <path d="M260 170 L270 300" stroke="#10b981" stroke-width="20" stroke-linecap="round"/>
    <path d="M330 170 L330 300" stroke="#10b981" stroke-width="20" stroke-linecap="round"/>
    <path d="M140 230 L420 230" stroke="#10b981" stroke-width="20" stroke-linecap="round"/>

    <!-- Sparkle / Speed Lines -->
    <polygon points="410,50 422,80 452,92 422,104 410,134 398,104 368,92 398,80" fill="#34d399"/>
  </g>

  <!-- Brand Typography: e-Duka -->
  <text x="256" y="420" 
        font-family="system-ui, -apple-system, 'Inter', Roboto, sans-serif" 
        font-size="44" 
        font-weight="800" 
        text-anchor="middle" 
        letter-spacing="2">
    <tspan fill="#34d399">e</tspan><tspan fill="#ffffff">-Duka</tspan>
  </text>
  
  <text x="256" y="450" 
        font-family="system-ui, -apple-system, 'Inter', Roboto, sans-serif" 
        font-size="16" 
        font-weight="600" 
        text-anchor="middle" 
        fill="#94a3b8" 
        letter-spacing="3">
    POS &amp; RETAIL ERP
  </text>
</svg>
